<!doctype html><meta charset="utf-8"><title>Clarity logo concepts</title>
<style>
:root{--r:#B3382B;--p:#F7F1E6;--ink:#14110C}
body{margin:0;background:#F2EEE3;color:var(--ink);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:40px 24px}
h1{font:600 22px Georgia,serif;margin:0 0 4px}p.s{margin:0 0 32px;color:#6b6456}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;max-width:1100px}
.c{background:#FBF8F1;border:1px solid #e0d9c8;border-radius:16px;padding:20px}
.big{display:flex;justify-content:center;padding:12px 0}.big svg{width:140px;height:140px}
.row{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px 0;padding:12px;border-radius:10px}
.row.d{background:var(--ink)}
.wm{font:600 26px Georgia,'Songti SC',serif;letter-spacing:-.01em}.row.d .wm{color:var(--p)}
h2{font-size:14px;margin:12px 0 2px}.c p{margin:0;color:#6b6456;font-size:13px}
</style>
<h1>Clarity 清 · logo concepts</h1><p class="s">Vermilion #B3382B on paper #F7F1E6, same palette as the app. Each shown large, at 32/16px, and with wordmark.</p>
<div class="g" id="g"></div>
<script>
const C=[
["A · Open seal","Current square-in-square, evolved: outer frame breaks at the top-right corner. Opening = clearing. Reads as a chop, survives 16px.",
`<rect width="32" height="32" rx="4" fill="#B3382B"/><g fill="none" stroke="#F7F1E6" stroke-width="2.6"><path d="M18 6H6v20h20V14"/><rect x="13" y="13" width="6" height="6" fill="#F7F1E6"/></g>`],
["B · Lens","Seal frame, circle, focus dot. Square (structure) resolving into a circle (focus). Most literal 'clarity'.",
`<rect width="32" height="32" rx="4" fill="#B3382B"/><g fill="none" stroke="#F7F1E6" stroke-width="2.4"><rect x="5.5" y="5.5" width="21" height="21"/><circle cx="16" cy="16" r="6.5"/></g><circle cx="16" cy="16" r="2.3" fill="#F7F1E6"/>`],
["C · Water radical","Three drops of 氵 beside a window. Nods to 清 (clear water) without drawing the full character.",
`<rect width="32" height="32" rx="4" fill="#B3382B"/><g fill="#F7F1E6"><circle cx="9" cy="9" r="2.2"/><circle cx="9" cy="16" r="2.2"/><circle cx="9" cy="23" r="2.2"/></g><rect x="15" y="7" width="10" height="18" fill="none" stroke="#F7F1E6" stroke-width="2.4"/>`],
["D · Return loop","Open ring with a solid square at center. The product's return loop: wrong answers circle back.",
`<rect width="32" height="32" rx="4" fill="#B3382B"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#F7F1E6" stroke-width="2.6" stroke-dasharray="48 12" stroke-linecap="butt" transform="rotate(-60 16 16)"/><rect x="12.5" y="12.5" width="7" height="7" fill="#F7F1E6"/>`],
["E · 清 chop","Carved character on the seal. Most distinctive and on-brand with 'Clarity 清', but needs a real font outlined and is muddy below ~24px.",
`<rect width="32" height="32" rx="4" fill="#B3382B"/><text x="16" y="25" text-anchor="middle" font-size="23" font-weight="700" fill="#F7F1E6" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif">清</text>`],
["F · Clear pane","Solid frame, the inner square knocked out to paper. A window: what's left when noise is gone.",
`<rect width="32" height="32" rx="4" fill="#B3382B"/><rect x="6" y="6" width="20" height="20" fill="#F7F1E6"/><rect x="12" y="12" width="8" height="8" fill="#B3382B"/>`]
];
const g=document.getElementById('g');
C.forEach(([n,d,s])=>{const sv=z=>`<svg viewBox="0 0 32 32" width="${z}" height="${z}">${s}</svg>`;
g.insertAdjacentHTML('beforeend',`<div class="c"><div class="big">${sv(140)}</div><h2>${n}</h2><p>${d}</p>
<div class="row">${sv(32)}${sv(16)}<span class="wm">Clarity</span></div>
<div class="row d">${sv(32)}${sv(16)}<span class="wm">Clarity</span></div></div>`)});
</script>
