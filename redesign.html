      THESIS: Clarity is a Mistake Notebook that fights back. Every miss is clipped in
      and returns on the day you'd forget it, until you beat it.
      Refuses the edtech default (blue gradient, white cards, stock student) and
      the old site's calm paper-and-ink editorial.
      OWN-WORLD: fluorescent highlighter inks (yellow, pink, green, blue, orange,
      violet) laid flat on 方格 grid paper; navy gel-pen text; red correction pen
      for grading; die-cut stickers, rubber stamps, paper clips, divider tabs,
      correction tape. Holo foil only on rewards.
      STORY: a student answers a real SAT question in the first viewport, watches
      the red pen grade it, sees a miss clipped in to come back, and presses Play.
      FIRST VIEWPORT: yellow field; left, the promise in wide Anybody display with
      the Play button under it; right, a live notebook page tilted on the desk.
      FORM: candidate 3, Mistake Notebook study desk; seed c1a7e5d2. Raises: flat-ink law
      (teletext), state is a mark (cutting bench), reward-only foil (arcade).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
