<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Ink River Descent</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #d8c39f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #d8c39f;
      }
      #focus-layer {
        --dof: 0px;
        position: absolute;
        inset: -12px;
        overflow: hidden;
        filter: blur(var(--dof));
        will-change: filter;
      }
      #world {
        position: absolute;
        inset: 12px;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #ink-base,
      #ink-end {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #ink-end {
        opacity: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .mist {
        position: absolute;
        pointer-events: none;
        border-radius: 50%;
        background: radial-gradient(ellipse at center,
          rgba(239, 225, 199, 0.66) 0%,
          rgba(234, 219, 193, 0.35) 46%,
          rgba(229, 213, 187, 0) 78%);
        mix-blend-mode: screen;
        filter: blur(24px);
        will-change: transform, opacity;
      }
      #mist-far {
        left: 320px;
        top: 230px;
        width: 1120px;
        height: 330px;
        opacity: 0.40;
      }
      #mist-mid {
        left: 510px;
        top: 445px;
        width: 980px;
        height: 280px;
        opacity: 0.36;
      }
      #mist-near {
        left: 160px;
        top: 610px;
        width: 1180px;
        height: 300px;
        opacity: 0.30;
      }
      #water-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: multiply;
      }
      .ripple {
        position: absolute;
        width: 180px;
        height: 34px;
        border: 2px solid rgba(74, 79, 69, 0.26);
        border-radius: 50%;
        opacity: 0;
        will-change: transform, opacity;
      }
      #ripple-a { left: 740px; top: 850px; }
      #ripple-b { left: 890px; top: 680px; width: 135px; height: 26px; }
      #ripple-c { left: 1050px; top: 600px; width: 105px; height: 22px; }
      #ripple-d { left: 610px; top: 930px; width: 240px; height: 42px; }
      .ink-bloom {
        position: absolute;
        border-radius: 52% 48% 58% 42%;
        opacity: 0;
        background: radial-gradient(ellipse at 54% 55%,
          rgba(35, 28, 22, 0.36) 0%,
          rgba(48, 38, 29, 0.20) 42%,
          rgba(58, 47, 36, 0) 74%);
        mix-blend-mode: multiply;
        filter: blur(13px);
        transform-origin: 50% 55%;
        will-change: transform, opacity;
      }
      #bloom-far { left: 920px; top: 300px; width: 390px; height: 170px; }
      #bloom-mid { left: 760px; top: 460px; width: 430px; height: 190px; }
      #bloom-near { left: 1030px; top: 530px; width: 520px; height: 240px; }
      #paper-light {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 54% 76%, rgba(247, 230, 196, 0.18), transparent 34%),
          radial-gradient(circle at 50% 45%, transparent 56%, rgba(74, 55, 38, 0.10) 100%);
        mix-blend-mode: soft-light;
        opacity: 0.62;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-grqc" id="root" data-composition-id="ink-river" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section data-hf-id="hf-lvka" id="scene" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore="">
        <div data-hf-id="hf-r2w3" id="focus-layer">
          <div data-hf-id="hf-j427" id="world">
            <img data-hf-id="hf-8o90" id="ink-base" src=".media/images/image_001.png" alt="">
            <img data-hf-id="hf-jz2n" id="ink-end" src=".media/images/image_002.png" alt="">
            <div data-hf-id="hf-roc6" id="mist-far" class="mist"></div>
            <div data-hf-id="hf-6ynv" id="mist-mid" class="mist"></div>
            <div data-hf-id="hf-csyx" id="mist-near" class="mist"></div>
            <div data-hf-id="hf-gsx5" id="water-field">
              <div data-hf-id="hf-h600" id="ripple-a" class="ripple"></div>
              <div data-hf-id="hf-ptvv" id="ripple-b" class="ripple"></div>
              <div data-hf-id="hf-lvru" id="ripple-c" class="ripple"></div>
              <div data-hf-id="hf-3425" id="ripple-d" class="ripple"></div>
            </div>
            <div data-hf-id="hf-2cop" id="bloom-far" class="ink-bloom"></div>
            <div data-hf-id="hf-ovr0" id="bloom-mid" class="ink-bloom"></div>
            <div data-hf-id="hf-ozm8" id="bloom-near" class="ink-bloom"></div>
            <div data-hf-id="hf-swma" id="paper-light"></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const world = document.getElementById("world");
      const endPlate = document.getElementById("ink-end");
      const cam = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
        const inverseScale = 1 / cam.scale;
        endPlate.style.transform = `translate(${-cam.x / cam.scale}px, ${-cam.y / cam.scale}px) scale(${inverseScale})`;
      };
      applyCamera();

      tl.addLabel("descent", 0);
      tl.to(cam, {
        scale: 1.18,
        x: 62,
        y: -42,
        duration: 2.0,
        ease: "sine.inOut",
        onUpdate: applyCamera
      }, "descent");
      tl.to(cam, {
        scale: 1.39,
        x: 168,
        y: -148,
        duration: 1.95,
        ease: "circ.inOut",
        onUpdate: applyCamera
      }, 2.0);
      tl.to(cam, {
        scale: 1.55,
        x: 248,
        y: -248,
        duration: 1.5,
        ease: "power1.inOut",
        onUpdate: applyCamera
      }, 3.95);

      tl.to("#ink-end", {
        opacity: 0.08,
        duration: 0.9,
        ease: "sine.inOut"
      }, 2.7);
      tl.to("#ink-end", {
        opacity: 1,
        duration: 1.3,
        ease: "sine.inOut"
      }, 3.601);

      tl.fromTo("#mist-far", { x: -30, y: 4, opacity: 0.34 }, {
        x: 42, y: -8, opacity: 0.46, duration: 5.45, ease: "none"
      }, 0);
      tl.fromTo("#mist-mid", { x: 28, y: 9, opacity: 0.42 }, {
        x: -54, y: -12, opacity: 0.22, duration: 5.45, ease: "sine.inOut"
      }, 0);
      tl.fromTo("#mist-near", { x: -46, y: 12, opacity: 0.22 }, {
        x: 62, y: -10, opacity: 0.38, duration: 5.45, ease: "power1.inOut"
      }, 0);

      const rippleEls = ["ripple-a", "ripple-b", "ripple-c", "ripple-d"].map((id) => document.getElementById(id));
      const ripplePhase = { p: 0 };
      tl.to(ripplePhase, {
        p: Math.PI * 2 * 3,
        duration: 5.45,
        ease: "none",
        onUpdate: () => {
          const progress = ripplePhase.p / (Math.PI * 2 * 3);
          const settle = progress < 0.88 ? 1 : Math.max(0, (1 - progress) / 0.12);
          rippleEls.forEach((el, index) => {
            const phase = ripplePhase.p + index * 1.35;
            const cycle = ((phase / (Math.PI * 2)) % 1 + 1) % 1;
            const wave = Math.max(0, Math.sin(phase));
            const scale = 0.78 + cycle * 0.72;
            el.style.transform = `scale(${scale})`;
            el.style.opacity = String(wave * 0.23 * settle);
          });
        }
      }, 0);

      [
        ["#bloom-far", 0.75, 0.82],
        ["#bloom-mid", 1.85, 0.92],
        ["#bloom-near", 3.05, 1.05]
      ].forEach(([selector, start, duration]) => {
        tl.fromTo(selector, { opacity: 0, scale: 0.42 }, {
          opacity: 0.18,
          scale: 1.03,
          duration: duration * 0.62,
          ease: "power1.out"
        }, start);
        tl.to(selector, {
          opacity: 0,
          scale: 1.18,
          duration: duration * 0.38,
          ease: "sine.inOut"
        }, start + duration * 0.62);
      });

      tl.to("#focus-layer", { "--dof": "5px", duration: 0.34, ease: "power1.inOut" }, 3.72);
      tl.to("#focus-layer", { "--dof": "0px", duration: 0.44, ease: "power1.inOut" }, 4.061);

      tl.to("#paper-light", { opacity: 0.76, duration: 1.0, ease: "sine.inOut" }, 4.45);
      window.__timelines["ink-river"] = tl;
    </script>
  </body>
</html>
