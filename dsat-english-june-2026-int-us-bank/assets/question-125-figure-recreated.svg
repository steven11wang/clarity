<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" role="img" aria-labelledby="rec-title rec-desc" font-family="Arial, sans-serif">
  <title id="rec-title">Estimated Value Added to Local Economies by Rural Electric Cooperatives, 2019 and 2022</title>
  <desc id="rec-desc">2019: direct 42.1, indirect 36.8, induced 18.4 billion dollars. 2022: direct 51.7, indirect 45.3, induced 22.6 billion dollars.</desc>
