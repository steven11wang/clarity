  <line x1="90" y1="128.33333333333331" x2="600" y2="128.33333333333331" stroke="#ccc" stroke-width="1"/>
  <text x="82" y="132.33333333333331" text-anchor="end" font-size="12">50</text>
  <line x1="90" y1="88" x2="600" y2="88" stroke="#ccc" stroke-width="1"/>
  <text x="82" y="92" text-anchor="end" font-size="12">60</text>
