<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 390" role="img" aria-labelledby="ice-title ice-desc" style="width:100%;max-width:650px"><title id="ice-title">Surface ice days in two winters</title><desc id="ice-desc">Lake Mendota: 180 days in 1980–81 and 100 days in 2004–05. Lake Balaton: 120 days in 1980–81 and 80 days in 2004–05.</desc><line x1="90" y1="30" x2="90" y2="320" stroke="#222"/><line x1="90" y1="320" x2="590" y2="320" stroke="#222"/><g stroke="#bbb"><line x1="90" y1="272" x2="590" y2="272"/><line x1="90" y1="223" x2="590" y2="223"/><line x1="90" y1="175" x2="590" y2="175"/><line x1="90" y1="127" x2="590" y2="127"/><line x1="90" y1="78" x2="590" y2="78"/><line x1="90" y1="30" x2="590" y2="30"/></g><g font-size="14" font-family="Arial"><text x="55" y="325">0</text><text x="48" y="277">50</text><text x="42" y="228">100</text><text x="42" y="180">150</text><text x="42" y="132">200</text><text x="42" y="83">250</text><text x="42" y="35">300</text><text x="18" y="190" transform="rotate(-90 18 190)">Days</text></g><rect x="175" y="146" width="60" height="174" fill="#777"/><rect x="235" y="204" width="60" height="116" fill="#ddd" stroke="#555"/><rect x="390" y="223" width="60" height="97" fill="#777"/><rect x="450" y="243" width="60" height="77" fill="#ddd" stroke="#555"/><g font-size="15" font-family="Arial" text-anchor="middle"><text x="235" y="345">1980–81</text><text x="450" y="345">2004–05</text></g><g font-size="14" font-family="Arial"><rect x="180" y="365" width="16" height="16" fill="#777"/><text x="202" y="378">Lake Mendota</text><rect x="360" y="365" width="16" height="16" fill="#ddd" stroke="#555"/><text x="382" y="378">Lake Balaton</text></g></svg>
